name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm test

      - name: Validate shell scripts
        run: |
          sh -n docker-entrypoint.sh
          bash -n scripts/deploy-ghcr.sh

      - name: Test job summary
        if: always()
        run: |
          {
            echo "## agentproxy test job"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Command: \`npm test\`"
            echo "- Scope: OpenAI service integration, streaming/prompt unit tests, performance checks, docs metadata"
          } >> "$GITHUB_STEP_SUMMARY"
